*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 20% 0%,#12386C 0%,var(--navy) 38%,var(--deep) 100%);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;min-height:100%}
button{font-family:var(--font);cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.btn{min-height:52px;padding:0 28px;border:0;background:var(--orange);color:#0B1B33;font-size:18px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--mute);margin-right:8px}
.dot.on{background:#4ADE80}

/* ---------- landing & guest ---------- */
.page{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px;min-height:100vh}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:56px;height:56px;border-radius:50%;flex:none}
.brand b{display:block;font-size:20px;font-weight:800;letter-spacing:.02em}
.brand small{display:block;color:var(--mute);font-size:13px}
.page h1{margin:8px 0 0;font-size:clamp(30px,8vw,44px);line-height:1.1;font-weight:800;text-wrap:balance}
.page h2{margin:0;font-size:clamp(24px,6.4vw,32px);line-height:1.2;font-weight:800;text-wrap:balance}
.lead{color:var(--mute);font-size:18px;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{min-height:56px;width:100%;padding:0 18px;font-family:var(--font);font-size:22px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);background:var(--card);border:2px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.opt{width:100%;min-height:64px;padding:14px 20px;text-align:left;font-size:18px;font-weight:600;line-height:1.35;background:var(--card);border:2px solid var(--line);color:var(--ink)}
.opt.sel{border-color:var(--orange);background:rgba(242,140,30,.18)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.scale .opt{text-align:center;font-size:28px;font-weight:800;padding:0;min-height:76px}
.scale-l{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.ta{width:100%;min-height:110px;padding:14px 16px;font-family:var(--font);font-size:18px;color:var(--ink);background:var(--card);border:2px solid var(--line);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;background:rgba(111,177,234,.18);border:1px solid var(--line);font-weight:600}
.note{color:var(--mute);font-size:14px;margin:0}
.warn{padding:14px 16px;background:rgba(242,140,30,.16);border:1px solid var(--orange);font-size:15px}

/* ---------- presenter stage ---------- */
.stage{position:relative;min-height:100vh;display:flex;flex-direction:column;padding:clamp(18px,2.6vw,40px) clamp(20px,4vw,72px) 0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:16px;color:var(--mute);font-weight:700;letter-spacing:.08em;font-size:clamp(13px,1.1vw,18px)}
.meta .brand img{width:clamp(36px,3.4vw,56px);height:clamp(36px,3.4vw,56px)}
.meta .brand b{font-size:clamp(14px,1.3vw,22px);color:var(--ink)}
.pill{display:inline-flex;align-items:center;padding:6px 16px;background:var(--card);border:1px solid var(--line)}
.pill.lock{border-color:var(--orange);color:var(--orange)}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,2.4vw,40px);padding:clamp(12px,2vw,32px) 0}
.q{margin:0;font-size:clamp(28px,4.4vw,78px);line-height:1.08;font-weight:800;text-wrap:balance;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.q-sub{font-size:clamp(18px,2vw,34px);color:var(--mute);margin:0}
.t-baslik,.t-kapanis{align-items:flex-start}
.t-baslik .q,.t-kapanis .q{font-size:clamp(40px,7vw,120px)}
.t-baslik .q span,.t-kapanis .q span{color:var(--orange)}
.big-logo{width:clamp(110px,14vw,240px);height:clamp(110px,14vw,240px);border-radius:50%;box-shadow:0 24px 64px rgba(0,0,0,.45);animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both}
.bars{display:flex;flex-direction:column;gap:clamp(10px,1.4vw,22px)}
.bar-row{display:grid;grid-template-columns:minmax(0,28%) minmax(0,1fr) auto;gap:clamp(12px,1.6vw,28px);align-items:center;animation:rise .6s both}
.bar-lab{font-size:clamp(16px,1.9vw,32px);font-weight:700;line-height:1.2}
.bar-trk{height:clamp(34px,4.4vw,70px);background:var(--card);border:1px solid var(--line);overflow:hidden}
.bar-fil{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--sky));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar-row.win .bar-fil{background:linear-gradient(90deg,#D9740A,var(--orange))}
.bar-val{min-width:5.5em;text-align:right;font-size:clamp(16px,2vw,34px);font-weight:800;font-variant-numeric:tabular-nums}
.bar-val small{display:block;font-size:.55em;color:var(--mute);font-weight:600}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px clamp(16px,2.4vw,40px);min-height:40vh}
.cloud span{font-weight:800;line-height:1.1;transition:font-size .7s cubic-bezier(.2,.8,.2,1);animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both;white-space:nowrap}
.avg{display:flex;align-items:baseline;gap:16px}
.avg b{font-size:clamp(70px,13vw,220px);line-height:1;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}
.avg span{font-size:clamp(20px,3vw,48px);color:var(--mute);font-weight:700}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{position:relative;padding:20px 22px;background:var(--card);border:1px solid var(--line);font-size:clamp(17px,1.7vw,28px);font-weight:600;line-height:1.3;animation:drop .6s cubic-bezier(.2,.9,.3,1.1) both;overflow-wrap:anywhere}
.card button{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;background:rgba(0,0,0,.35);opacity:0;font-size:18px;line-height:1}
.card:hover button{opacity:1}
.empty{color:var(--mute);font-size:clamp(18px,2vw,32px);animation:pulse 2.4s ease-in-out infinite}
.join{display:flex;align-items:center;gap:clamp(14px,2vw,28px);padding:clamp(12px,1.4vw,20px) 0 clamp(14px,1.8vw,26px);border-top:1px solid var(--line)}
.join .qr{flex:none;background:#fff;padding:8px;line-height:0}
.join .qr img,.join .qr canvas{width:clamp(84px,9vw,150px)!important;height:clamp(84px,9vw,150px)!important}
.join b{display:block;font-size:clamp(16px,1.8vw,30px);font-weight:800}
.join small{display:block;color:var(--mute);font-size:clamp(12px,1.2vw,20px);overflow-wrap:anywhere}
.join .code{margin-left:auto;text-align:right}
.join .code strong{display:block;font-size:clamp(28px,4vw,72px);letter-spacing:.14em;color:var(--orange);line-height:1}
.ctrl{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:rgba(6,23,47,.92);border:1px solid var(--line);z-index:5;transition:opacity .4s}
.ctrl.hide{opacity:0;pointer-events:none}
.ctrl button{min-height:44px;padding:0 16px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.modal{position:fixed;inset:0;z-index:10;background:rgba(3,10,22,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{width:min(860px,100%);max-height:92vh;overflow:auto;background:var(--navy);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:14px}
.modal textarea{width:100%;min-height:300px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.55;color:var(--ink);background:var(--deep);border:1px solid var(--line)}
.modal code{background:var(--deep);padding:1px 6px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@media (max-width:760px){.bar-row{grid-template-columns:1fr auto}.bar-lab{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- ambient network background ---------- */
var bgCount=function(){return 0;};
(function(){
  var cv=document.getElementById('bg'),cx=cv.getContext('2d'),W,H,nodes=[];
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  size();addEventListener('resize',size);
  for(var i=0;i<60;i++)nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,p:Math.random()*6});
  function frame(t){
    cx.clearRect(0,0,W,H);
    var n=bgCount();
    nodes.forEach(function(a){if(!reduce){a.x+=a.vx;a.y+=a.vy;if(a.x<0)a.x=W;if(a.x>W)a.x=0;if(a.y<0)a.y=H;if(a.y>H)a.y=0;}});
    for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
      var a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<170){cx.strokeStyle='rgba(111,177,234,'+(0.22*(1-d/170))+')';cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}
    }
    nodes.forEach(function(a,i){
      var on=i<n,r=on?4+1.5*Math.sin(t/400+a.p):2.2;
      if(on){cx.fillStyle='rgba(242,140,30,.25)';cx.beginPath();cx.arc(a.x,a.y,r*3.2,0,6.3);cx.fill();}
      cx.fillStyle=on?'#F28C1E':'rgba(180,205,235,.55)';cx.beginPath();cx.arc(a.x,a.y,r,0,6.3);cx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

var TYPES=['baslik','anket','bulut','olcek','fikir','kapanis'];
var DEFAULT_DECK=[
'# Her satır bir slayt. Biçim:  tür: Metin | seçenek veya bilgi | ...',
'# Türler: baslik, anket, bulut, olcek, fikir, kapanis',
'baslik: GİTEK\'e hoş geldiniz | Girişimcilik ve Teknoloji Topluluğu. Telefonunuzla katılın.',
'bulut: Girişimcilik size neyi çağrıştırıyor? (tek kelime)',
'bulut: Teknoloji deyince akla ne geliyor? (tek kelime)',
'anket: Hangi alan sizi daha çok heyecanlandırıyor? | Girişimcilik ve iş fikirleri | Yapay zekâ ve veri | Yazılım ve uygulama | Tasarım, sosyal medya ve etkinlik',
'kapanis: Aramıza katılın | Standımıza uğrayın, formu doldurun, ekibini seç.'
].join('\n');
function parseDeck(text){
  var seen={};
  return text.split('\n').map(function(l){return l.trim();}).filter(function(l){return l&&l[0]!=='#';}).map(function(l){
    var i=l.indexOf(':');if(i<1)return null;
    var type=l.slice(0,i).trim().toLowerCase();if(TYPES.indexOf(type)<0)return null;
    var parts=l.slice(i+1).split('|').map(function(s){return s.trim();}).filter(Boolean);
    var s={type:type,q:parts[0]||'',opts:parts.slice(1)};
    var id=type+'-'+hash(s.q+s.opts.join('|'));seen[id]=(seen[id]||0)+1;if(seen[id]>1)id+='-'+seen[id];
    s.id=id;return s;
  }).filter(Boolean);
}

/* ---------- transports (WebRTC via PeerJS, or same-browser local) ---------- */
function bcName(code){return 'gitek-live-'+code;}
function peerId(code){return 'gitek-live-'+code;}

function hostTransport(code,H){
  if(LOCAL){
    var ch=new BroadcastChannel(bcName(code));
    ch.onmessage=function(ev){var d=ev.data;if(d&&d.to==='host')H.msg(d.from,d.m);};
    setTimeout(function(){H.ready();},0);
    return {send:function(cid,m){ch.postMessage({to:cid,m:m});},all:function(m){ch.postMessage({to:'*',m:m});}};
  }
  if(typeof Peer==='undefined'){H.error('Bağlantı kitaplığı yüklenemedi. İnternet bağlantısını kontrol edin.');return {send:function(){},all:function(){}};}
  var conns={},tries=0,peer;
  function open(){
    peer=new Peer(peerId(code));
    peer.on('open',function(){H.ready();});
    peer.on('connection',function(c){
      c.on('open',function(){conns[c.peer]=c;if(H.open)H.open(c.peer);});
      c.on('data',function(m){H.msg(c.peer,m);});
      c.on('close',function(){delete conns[c.peer];});
      c.on('error',function(){delete conns[c.peer];});
    });
    peer.on('error',function(e){
      if(e&&e.type==='unavailable-id'&&tries<8){tries++;setTimeout(function(){try{peer.destroy();}catch(x){}open();},2500);return;}
      H.error('Bağlantı hatası: '+(e&&e.type||'bilinmeyen'));
    });
    peer.on('disconnected',function(){try{peer.reconnect();}catch(e){}});
  }
  open();
  return {
    send:function(cid,m){var c=conns[cid];if(c&&c.open)c.send(m);},
    all:function(m){for(var k in conns){if(conns[k].open)conns[k].send(m);}}
  };
}

function guestTransport(code,G){
  var me=Math.random().toString(36).slice(2,10);
  if(LOCAL){
    var ch=new BroadcastChannel(bcName(code));
    ch.onmessage=function(ev){var d=ev.data;if(d&&(d.to===me||d.to==='*'))G.msg(d.m);};
    setTimeout(function(){G.up();},0);
    return {send:function(m){ch.postMessage({to:'host',from:me,m:m});}};
  }
  if(typeof Peer==='undefined'){G.error('Bağlantı kitaplığı yüklenemedi. İnternet bağlantınızı kontrol edin.');return {send:function(){}};}
  var peer=new Peer(),conn=null,att=0,opened=false;
  function st(t){if(G.stage)G.stage(t);}
  st('1/2 Aracı sunucuya bağlanılıyor…');
  setTimeout(function(){if(!opened)st('Bağlantı kurulamadı. Wi-Fi yerine mobil veriyi deneyin ve sunum bilgisayarındaki sayfanın açık olduğundan emin olun.');},12000);
  function connect(){
    att++;st('2/2 Sunum bilgisayarı aranıyor (deneme '+att+')…');
    conn=peer.connect(peerId(code),{reliable:true});
    conn.on('open',function(){opened=true;G.up();});
    conn.on('data',function(m){G.msg(m);});
    conn.on('close',function(){G.down();st('Bağlantı koptu, yeniden deneniyor…');setTimeout(connect,2000);});
    conn.on('error',function(e){G.down();st('Bağlantı hatası: '+(e&&e.type||'bilinmeyen'));});
  }
  peer.on('open',function(){st('1/2 Aracı sunucuya bağlandı');connect();});
  peer.on('error',function(e){
    G.down();var t=e&&e.type||'bilinmeyen';
    if(t==='peer-unavailable'){st('Sunum ekranı bulunamadı. Sunum bilgisayarında sayfanın açık ve "Sunucu hazır" yazdığından emin olun. Yeniden deneniyor…');setTimeout(function(){if(!peer.destroyed&&!opened)connect();},2500);}
    else st('Hata: '+t+(t==='network'||t==='server-error'||t==='socket-error'?' (ağ bağlantısı engelleniyor olabilir, mobil veriyi deneyin)':''));
  });
  return {send:function(m){if(conn&&conn.open)conn.send(m);}};
}

/* ---------- guest ---------- */
function guest(){
  var u=uid(),state=null,up=false,tr,mine={},rendered='',diag='';
  var box=h('div',{class:'card-box'});
  var stat=h('span',null,'Bağlanıyor…'),dot=h('span',{class:'dot'});
  var wrap=h('div',{class:'page'},
    h('div',{class:'brand'},h('img',{src:LOGO,alt:'GİTEK logosu'}),h('div',null,h('b',null,'GİTEK Canlı'),h('small',null,dot,stat))),
    box);
  app.append(wrap);
  function k(sid){return 'gitek.my.'+CODE+'.'+sid;}
  function getMine(sid){try{return JSON.parse(sget(k(sid)));}catch(e){return null;}}
  function setMine(sid,v){sset(k(sid),JSON.stringify(v));}
  function setUp(v){up=v;dot.className='dot'+(v?' on':'');stat.textContent=v?(state?'Bağlandı':'Bağlandı, yanıt bekleniyor'):'Bağlanıyor…';}
  function send(sid,v){tr.send({t:'vote',u:u,sid:sid,v:v});}
  function render(){
    if(!state){box.replaceChildren(h('p',{class:'lead'},'Sunucudan yanıt bekleniyor.'),diag?h('div',{class:'warn'},diag):null,h('p',{class:'note'},'Sayfayı yenileyin veya ekrandaki QR kodu yeniden okutun.'));return;}
    var s=state,key=s.sid+'|'+s.locked;if(key===rendered)return;rendered=key;
    var m=getMine(s.sid),out=[h('h2',null,s.q)];
    if(s.locked&&(s.type==='anket'||s.type==='bulut'||s.type==='olcek'||s.type==='fikir'))out.push(h('p',{class:'note'},'Oylama kapandı.'));
    if(s.type==='baslik'||s.type==='kapanis'){
      out.push(h('p',{class:'lead'},s.type==='baslik'?'Sunum başlıyor. Etkileşimli slaytlar geldiğinde bu ekran güncellenecek.':'Katıldığınız için teşekkürler.'));
      if(s.opts&&s.opts[0])out.push(h('p',{class:'lead'},s.opts[0]));
    }
    if(s.type==='anket'){
      var ul=h('ul',{class:'opts'});
      s.opts.forEach(function(o,i){
        var b=h('button',{class:'opt'+(m===i?' sel':''),disabled:s.locked,onclick:function(){setMine(s.sid,i);send(s.sid,i);rendered='';render();}},o);
        ul.append(h('li',null,b));
      });
      out.push(ul);if(m!=null)out.push(h('p',{class:'note'},'Oyunuz alındı. Süre dolmadan değiştirebilirsiniz.'));
    }
    if(s.type==='olcek'){
      var sc=h('div',{class:'scale'});
      [1,2,3,4,5].forEach(function(n){sc.append(h('button',{class:'opt'+(m===n?' sel':''),disabled:s.locked,'aria-label':String(n),onclick:function(){setMine(s.sid,n);send(s.sid,n);rendered='';render();}},String(n)));});
      out.push(sc,h('div',{class:'scale-l'},h('span',null,'1'),h('span',null,'5')));
      if(m!=null)out.push(h('p',{class:'note'},'Yanıtınız alındı. Süre dolmadan değiştirebilirsiniz.'));
    }
    if(s.type==='bulut'||s.type==='fikir'){
      var list=Array.isArray(m)?m:[],max=3,isIdea=s.type==='fikir';
      var ctl=isIdea?h('textarea',{class:'ta',maxlength:'140',placeholder:'Fikrinizi yazın',id:'giris','aria-label':'Fikriniz'}):h('input',{class:'field',style:'text-transform:none;letter-spacing:0;font-size:20px',maxlength:'24',placeholder:'Tek bir kelime',id:'giris','aria-label':'Kelimeniz'});
      var btn=h('button',{class:'btn',disabled:s.locked||list.length>=max,onclick:send1},'Gönder');
      function send1(){var t=ctl.value.trim();if(!t||list.length>=max)return;list=list.concat([t]);setMine(s.sid,list);send(s.sid,list);rendered='';render();}
      ctl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!isIdea){e.preventDefault();send1();}});
      if(list.length<max&&!s.locked)out.push(ctl,btn);
      if(list.length)out.push(h('p',{class:'note'},'Gönderdikleriniz ('+list.length+'/'+max+'):'),h('div',{class:'chips'},list.map(function(t){return h('span',{class:'chip'},t);})));
      else if(!s.locked)out.push(h('p',{class:'note'},'En fazla '+max+' yanıt gönderebilirsiniz.'));
    }
    box.replaceChildren.apply(box,out);
  }
  tr=guestTransport(CODE,{
    up:function(){setUp(true);tr.send({t:'hello',u:u});},
    down:function(){setUp(false);},
    stage:function(t){diag=t;render();},
    error:function(msg){box.replaceChildren(h('div',{class:'warn'},msg));},
    msg:function(m){if(m&&m.t==='state'){state=m;setUp(up);render();}}
  });
  setInterval(function(){if(up)tr.send({t:'hb',u:u});},5000);
  setInterval(function(){if(up&&!state)tr.send({t:'hello',u:u});},2500);
  render();
}

/* ---------- presenter ---------- */
function host(){
  var code=sget('gitek.room')||'';
  if(!/^[A-Z0-9]{5}$/.test(code)){var al='ABCDEFGHJKLMNPRSTUVYZ23456789';code='';for(var i=0;i<5;i++)code+=al[Math.floor(Math.random()*al.length)];sset('gitek.room',code);}
  var deckText=sget('gitek.deck')||DEFAULT_DECK,deck=parseDeck(deckText);
  var idx=Math.min(parseInt(sget('gitek.idx')||'0',10)||0,Math.max(deck.length-1,0));
  var results={};try{results=JSON.parse(sget('gitek.results')||'{}')||{};}catch(e){results={};}
  var hidden={},locked={},hb={},showRes=true,tr,upd=function(){},ready=false,errMsg='';
  try{hidden=JSON.parse(sget('gitek.hidden')||'{}')||{};}catch(e){hidden={};}
  var saveT=0;
  function save(){clearTimeout(saveT);saveT=setTimeout(function(){sset('gitek.results',JSON.stringify(results));sset('gitek.hidden',JSON.stringify(hidden));sset('gitek.idx',String(idx));},300);}
  function joinUrl(){return location.origin+location.pathname+'?k='+code+(LOCAL?'&yerel=1':'');}
  function count(){var n=0,now=Date.now();for(var k in hb)if(now-hb[k]<16000)n++;return n;}
  bgCount=count;
  function cur(){return deck[idx];}
  function pubState(){var s=cur();if(!s)return {t:'state',sid:'none',type:'baslik',q:'',opts:[],locked:true};return {t:'state',sid:s.id,type:s.type,q:s.q,opts:s.opts,idx:idx,total:deck.length,locked:!!locked[s.id]};}
  function broadcast(){tr.all(pubState());}
  function votesFor(sid){return results[sid]||{};}

  var stage=h('div',{class:'stage'}),ctrl,modal=null;
  var nEl=h('span',{class:'pill'},'0 katılımcı');
  var stEl=h('span',{class:'pill'},h('span',{class:'dot'}),'Bağlantı kuruluyor…');
  function setSt(ok,msg){stEl.replaceChildren(h('span',{class:'dot'+(ok?' on':'')}),msg);}
  function setNum(el,to,dec){
    var from=parseFloat(el.dataset.v||'0');el.dataset.v=to;
    var t0=performance.now();(function step(t){var p=Math.min(1,(t-t0)/600),e=1-Math.pow(1-p,3),v=from+(to-from)*e;el.textContent=dec?v.toFixed(dec).replace('.',','):Math.round(v);if(p<1)requestAnimationFrame(step);})(t0);
  }
  var palette=['#F28C1E','#6FB1EA','#FFFFFF','#4ADE80','#F5C16C','#9CC9F0'];

  function build(){
    var s=cur();upd=function(){};
    var meta=h('div',{class:'meta'},
      h('div',{class:'brand'},h('img',{src:LOGO,alt:''}),h('b',null,'GİTEK Canlı')),
      h('div',{class:'row',style:'align-items:center'},
        locked[s&&s.id]?h('span',{class:'pill lock'},'Oylama kapalı'):null,
        stEl,nEl,
        h('span',{class:'pill'},(idx+1)+' / '+deck.length)));
    var join=h('div',{class:'join'},
      h('div',{class:'qr',id:'qr'}),
      h('div',null,h('b',null,'Katılmak için QR kodu okutun'),h('small',null,joinUrl().replace(/^https?:\/\//,''))),
      null);
    var body=h('div',{class:'slide'});
    if(!s){body.append(h('p',{class:'q'},'Slayt yok. Alttaki Düzenle düğmesinden ekleyin.'));}
    else{
      var sid=s.id;
      if(s.type==='baslik'||s.type==='kapanis'){
        var words=s.q.split(' ');var last=words.pop();
        body.append(h('img',{class:'big-logo',src:LOGO,alt:'GİTEK logosu'}),h('h1',{class:'q'},words.join(' ')+' ',h('span',null,last)));
        if(s.opts[0])body.append(h('p',{class:'q-sub'},s.opts[0]));
      }else{
        body.append(h('h1',{class:'q'},s.q));
      }
      if(s.type==='anket'){
        var bars=h('div',{class:'bars'}),rows=[];
        s.opts.forEach(function(o,i){
          var f=h('div',{class:'bar-fil'}),v=h('div',{class:'bar-val'},'0'),r=h('div',{class:'bar-row',style:'animation-delay:'+(i*80)+'ms'},h('div',{class:'bar-lab'},o),h('div',{class:'bar-trk'},f),v);
          rows.push({r:r,f:f,v:v});bars.append(r);
        });
        body.append(bars);
        upd=function(){
          var vs=votesFor(sid),c=s.opts.map(function(){return 0;}),tot=0;
          for(var u in vs){var x=vs[u];if(typeof x==='number'&&c[x]!==undefined){c[x]++;tot++;}}
          var mx=Math.max.apply(null,c);
          rows.forEach(function(o,i){
            var p=tot?c[i]/tot:0;
            o.f.style.width=showRes?(p*100)+'%':'0%';
            o.v.replaceChildren(showRes?String(c[i]):'?',h('small',null,showRes?Math.round(p*100)+' %':''));
            o.r.classList.toggle('win',showRes&&mx>0&&c[i]===mx);
          });
        };
      }
      if(s.type==='bulut'){
        var cloud=h('div',{class:'cloud'}),map={},empty=h('p',{class:'empty'},'İlk kelimeyi bekliyoruz…');
        cloud.append(empty);body.append(cloud);
        upd=function(){
          var vs=votesFor(sid),cnt={};
          for(var u in vs){(vs[u]||[]).forEach(function(w){var k=String(w).trim().toLocaleLowerCase('tr-TR').slice(0,24);if(k)cnt[k]=(cnt[k]||0)+1;});}
          var ks=Object.keys(cnt),mx=Math.max.apply(null,ks.map(function(k){return cnt[k];}).concat([1]));
          empty.style.display=ks.length&&showRes?'none':'';
          if(!showRes){cloud.querySelectorAll('span').forEach(function(e){e.remove();});map={};return;}
          ks.forEach(function(k){
            if(!map[k]){map[k]=h('span',{style:'color:'+palette[parseInt(hash(k),36)%palette.length]},k);cloud.append(map[k]);}
            map[k].style.fontSize=(24+Math.round(Math.min(1,cnt[k]/mx)*Math.min(1,.4+cnt[k]*.15)*Math.min(innerWidth*.06,96)))+'px';
          });
          Object.keys(map).forEach(function(k){if(!cnt[k]){map[k].remove();delete map[k];}});
        };
      }
      if(s.type==='olcek'){
        var big=h('b',{'data-v':'0'},'0'),tot2=h('span',null,'/ 5 · 0 yanıt'),bars2=h('div',{class:'bars'}),rows2=[];
        for(var n=1;n<=5;n++){var f2=h('div',{class:'bar-fil'}),v2=h('div',{class:'bar-val'},'0');var r2=h('div',{class:'bar-row',style:'animation-delay:'+(n*70)+'ms'},h('div',{class:'bar-lab'},String(n)),h('div',{class:'bar-trk'},f2),v2);rows2.push({f:f2,v:v2});bars2.append(r2);}
        body.append(h('div',{class:'avg'},big,tot2),bars2);
        upd=function(){
          var vs=votesFor(sid),c=[0,0,0,0,0],sum=0,t=0;
          for(var u in vs){var x=vs[u];if(x>=1&&x<=5){c[x-1]++;sum+=x;t++;}}
          if(showRes){setNum(big,t?sum/t:0,1);}else{big.textContent='?';big.dataset.v='0';}
          tot2.textContent='/ 5 · '+t+' yanıt';
          rows2.forEach(function(o,i){o.f.style.width=showRes&&t?(c[i]/t*100)+'%':'0%';o.v.textContent=showRes?String(c[i]):'?';});
        };
      }
      if(s.type==='fikir'){
        var wall=h('div',{class:'wall'}),cards={},empty2=h('p',{class:'empty'},'İlk fikri bekliyoruz…');
        body.append(empty2,wall);
        upd=function(){
          var vs=votesFor(sid),keep={},n=0;
          Object.keys(vs).forEach(function(u){(vs[u]||[]).forEach(function(t,i){
            var key=u+':'+i;if(hidden[sid+'|'+key])return;keep[key]=1;n++;
            if(!cards[key]){
              var del=h('button',{'aria-label':'Kaldır',title:'Kaldır',onclick:function(){hidden[sid+'|'+key]=1;save();upd();}},'×');
              cards[key]=h('div',{class:'card'},String(t).slice(0,140),del);wall.prepend(cards[key]);
            }
          });});
          Object.keys(cards).forEach(function(k){if(!keep[k]){cards[k].remove();delete cards[k];}});
          empty2.style.display=n?'none':'';
          wall.style.visibility=showRes?'':'hidden';
        };
      }
    }
    stage.replaceChildren(meta,body,join);
    var qrEl=document.getElementById('qr');if(typeof QRCode==='undefined'&&qrEl)qrEl.remove();if(typeof QRCode!=='undefined'){try{new QRCode(document.getElementById('qr'),{text:joinUrl(),width:150,height:150,colorDark:'#0F2D57',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
    if(location.protocol==='file:'&&!LOCAL)body.prepend(h('div',{class:'warn'},'Bu dosya bilgisayardan açıldı. Telefonlar bağlanamaz. Dosyayı internete yükleyip oradan açın.'));
    if(errMsg)body.prepend(h('div',{class:'warn'},errMsg));
    upd();
  }
  function go(d){if(!deck.length)return;idx=Math.max(0,Math.min(deck.length-1,idx+d));showRes=true;save();build();broadcast();}
  function tgl(f){var s=cur();if(!s)return;if(f==='lock'){locked[s.id]=!locked[s.id];build();broadcast();}if(f==='res'){showRes=!showRes;upd();}}
  function fs(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
  function edit(){
    var ta=h('textarea',{'aria-label':'Slayt listesi',spellcheck:'false'});ta.value=deckText;
    modal=h('div',{class:'modal'},h('div',{class:'box'},
      h('h2',{style:'margin:0'},'Slaytları düzenle'),
      h('p',{class:'note'},'Her satır bir slayttır. Biçim: ',h('code',null,'tür: Metin | seçenek | seçenek')),
      h('p',{class:'note'},'Türler: ',h('code',null,'baslik'),' ',h('code',null,'anket'),' ',h('code',null,'bulut'),' ',h('code',null,'olcek'),' ',h('code',null,'fikir'),' ',h('code',null,'kapanis'),'. # ile başlayan satırlar yok sayılır.'),
      ta,
      h('div',{class:'row'},
        h('button',{class:'btn',onclick:function(){deckText=ta.value;deck=parseDeck(deckText);sset('gitek.deck',deckText);idx=0;modal.remove();modal=null;save();build();broadcast();}},'Kaydet'),
        h('button',{class:'btn ghost',onclick:function(){ta.value=DEFAULT_DECK;}},'Varsayılana dön'),
        h('button',{class:'btn ghost',onclick:function(){if(confirm('Tüm oylar silinsin mi?')){results={};hidden={};save();upd();}}},'Oyları sıfırla'),
        h('button',{class:'btn ghost',onclick:function(){modal.remove();modal=null;}},'Kapat'))));
    document.body.append(modal);
  }
  ctrl=h('div',{class:'ctrl'},
    h('button',{onclick:function(){go(-1);}},'‹ Önceki'),
    h('button',{onclick:function(){go(1);}},'Sonraki ›'),
    h('button',{onclick:function(){tgl('lock');}},'Oylamayı kapat/aç'),
    h('button',{onclick:function(){tgl('res');}},'Sonuçları gizle/göster'),
    h('button',{onclick:fs},'Tam ekran'),
    h('button',{onclick:edit},'Düzenle'));
  var ht;function wake(){ctrl.classList.remove('hide');clearTimeout(ht);ht=setTimeout(function(){ctrl.classList.add('hide');},3500);}
  addEventListener('mousemove',wake);addEventListener('touchstart',wake);wake();
  addEventListener('keydown',function(e){
    if(modal||/^(TEXTAREA|INPUT)$/.test((e.target||{}).tagName))return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(-1);}
    else if(e.key==='f'||e.key==='F')fs();
    else if(e.key==='l'||e.key==='L')tgl('lock');
    else if(e.key==='h'||e.key==='H')tgl('res');
  });
  app.append(stage,ctrl);
  tr=hostTransport(code,{
    ready:function(){ready=true;setSt(true,'Sunucu hazır');broadcast();},
    open:function(cid){tr.send(cid,pubState());},
    error:function(m){errMsg=m;setSt(false,'Bağlantı yok');build();},
    msg:function(cid,m){
      if(!m||typeof m!=='object'||typeof m.u!=='string')return;
      hb[m.u]=Date.now();
      if(m.t==='hello'){tr.send(cid,pubState());nEl.textContent=count()+' katılımcı';return;}
      if(m.t==='vote'){
        var s=cur();if(!s||m.sid!==s.id||locked[s.id])return;
        var v=m.v,ok=false;
        if(s.type==='anket'&&Number.isInteger(v)&&v>=0&&v<s.opts.length)ok=true;
        if(s.type==='olcek'&&Number.isInteger(v)&&v>=1&&v<=5)ok=true;
        if((s.type==='bulut'||s.type==='fikir')&&Array.isArray(v)){v=v.slice(0,3).map(function(t){return String(t).slice(0,s.type==='bulut'?24:140);}).filter(function(t){return t.trim();});ok=v.length>0;}
        if(!ok)return;
        (results[s.id]=results[s.id]||{})[m.u]=v;save();upd();
      }
    }
  });
  setInterval(function(){var n=count();nEl.textContent=n+' katılımcı';},1500);
  if(LOCAL)setSt(true,'Yerel mod');
  build();
}

/* ---------- start ---------- */
if(IS_HOST)host();else if(CODE)guest();else landing();
})();
